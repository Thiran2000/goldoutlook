        '<h4>' + t('p_d_fx') + '</h4><div class="dl"><span>' + t('p_now') + '</span><b>Rs ' + nf(sr.fx[sr.fx.length - 1], 2) + '</b></div><div class="dl"><span>' + t('p_d_30') + '</span><b>' + pc(fxc) + '</b></div><div class="dl"><span>' + t('p_d_rng') + '</span><b>Rs ' + nf(fF.q05, 1) + ' – ' + nf(fF.q95, 1) + '</b></div></div>' +
        '<div class="card drv"><h4>' + t('p_d_both') + '</h4><div class="dl"><span>' + t('p_d_30') + '</span><b>' + pc(gc === null ? null : (1 + gc) * (1 + fxc) - 1) + '</b></div>' +
        '<h4>' + t('p_d_prem') + '</h4><div class="dl"><span>' + (prem === null ? t('p_d_premn') : t('p_d_premv', { p: nf(prem * 100, 1) + '%' })) + '</span><b>' + (prem === null ? '-' : '22K · ' + rs(d.sells[22])) + '</b></div>' +
        (d.hasRetail && d.retail ? '<p class="note">' + d.retail.name + '</p>' : '') + '</div></div></div></section>';
    }

    /* accuracy + method */
    var bt = backtest(M.S, 5, M.D);
    html += '<section class="ps"><div class="container"><div class="two"><div class="card"><h3>' + t('p_acc') + '</h3>' + (bt ?
      '<p class="note" style="margin:6px 0 12px">' + t('p_acc_lead', { h: 5, n: bt.n }) + '</p><div class="tw"><table class="pt" style="min-width:0"><thead><tr><th>' + t('p_a_m') + '</th><th class="n">' + t('p_a_miss') + '</th></tr></thead><tbody>' +
      [['p_a_model', bt.model], ['p_a_naive', bt.naive], ['p_a_trend', bt.trend]].map(function (r) { return '<tr style="cursor:default"><td>' + t(r[0]) + '</td><td class="n">' + nf(r[1] * 100, 2) + '%</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<p class="note">' + t('p_a_cov', { c: nf(bt.coverage * 100, 0) }) + '</p>' : '<p class="note">' + t('p_a_na') + '</p>') + '</div>' +
      '<div class="card"><h3>' + t('p_meth') + '</h3><p class="note" style="margin-top:8px">' + t('p_meth_t') + '</p></div></div>' +
      '<p class="upd">' + t('p_upd', { t: G.ago(d.updated) }) + '</p><div class="disc">' + t('p_disc') + '</div></div></section>';

    $('main').innerHTML = html;
    G.enhance($('main'));
    ST._fc = fc; ST._M = M;
    renderTarget();
  }

  function renderTarget() {
    var el = $('tres'); if (!el || !ST._fc) return;
    var x = parseFloat(String(ST.target).replace(/[, ]/g, '')), fc = ST._fc, M = ST._M;
    if (!(x > 0)) { el.innerHTML = '<p class="note" style="margin:0">' + t('p_tgt_bad') + '</p>'; return; }
    var a = probAbove(fc, x), b = 1 - a;
    el.innerHTML = '<div class="tres"><div><b>' + nf(a * 100, a < 0.1 || a > 0.9 ? 1 : 0) + '%</b><span>' + t('p_tgt_ab', { x: M.fmt(x) }) + '</span><div class="bar"><i style="width:' + (a * 100).toFixed(1) + '%"></i></div></div><div><b>' + nf(b * 100, b < 0.1 || b > 0.9 ? 1 : 0) + '%</b><span>' + t('p_tgt_be', { x: M.fmt(x) }) + '</span><div class="bar"><i style="width:' + (b * 100).toFixed(1) + '%"></i></div></div></div>';
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target : null; if (!el) return;
    var b;
    if ((b = el.closest('#mk button[data-mk]'))) { ST.mk = b.getAttribute('data-mk'); ST.target = ''; render(); return; }
    if ((b = el.closest('button[data-gc]'))) { ST.mk = b.getAttribute('data-gc'); ST.target = ''; render(); var bd = document.querySelector('.board'); if (bd && bd.scrollIntoView) bd.scrollIntoView({ behavior: G.reduce ? 'auto' : 'smooth', block: 'start' }); return; }
    if ((b = el.closest('button[data-o]'))) { var kv = b.getAttribute('data-o').split(':'); if (kv[0] === 'karat' || kv[0] === 'h') ST[kv[0]] = parseInt(kv[1], 10); else ST[kv[0]] = kv[1]; ST.target = ''; render(); return; }
    if ((b = el.closest('tr[data-h]'))) { ST.h = parseInt(b.getAttribute('data-h'), 10); ST.target = ''; render(); return; }
    if ((b = el.closest('button[data-tp]'))) { var p = parseFloat(b.getAttribute('data-tp')); if (ST._fc) { var raw = ST._fc.last * (1 + p); ST.target = String(ST.mk === 'sl' ? Math.round(raw / 100) * 100 / (ST.unit === 'g' ? 1 : 1) : Math.round(raw * 100) / 100); var inp = $('tg'); if (inp) inp.value = ST.target; renderTarget(); } return; }
  });
  document.addEventListener('input', function (e) { if (e.target && e.target.id === 'tg') { ST.target = e.target.value; renderTarget(); } });
  window.addEventListener('gollk-lang', render);

  /* ---------- start ---------- */
  fetch('data/prices.csv', { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : Promise.reject(); }).then(function (tx) { HIST = parseCsv(tx); render(); }).catch(function () { histErr = true; render(); });
  G.on(function (d) {
    var same = DATA && DATA.spot === d.spot && DATA.fx === d.fx && DATA.hasRetail === d.hasRetail && (!d.hasRetail || DATA.sells[22] === d.sells[22]);
    DATA = d; if (!same) render();
  });
})();
</script>
</body>
</html>
