<style>
/* Layout: slim top bar (name, section links, language) then one column: live price, weight lookup, forecast, buying guide, alerts, learn, footer. */
:root {
  --bg: #f2f4f2;
  --surface: #ffffff;
  --fg: #19201c;
  --muted: #5c6862;
  --line: #d7ddd8;
  --accent: #9a6a12;
  --accent-soft: rgba(154, 106, 18, 0.16);
  --accent-softer: rgba(154, 106, 18, 0.08);
  --up: #1d7a5a;
  --down: #b4412f;
  --warn: #8a5a00;
  --font-body: "IBM Plex Sans", "Noto Sans Sinhala", "Noto Sans Tamil", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #181d1a; --fg: #e8ece9; --muted: #98a39c; --line: #2b332e;
    --accent: #d8a23d; --accent-soft: rgba(216, 162, 61, 0.22); --accent-softer: rgba(216, 162, 61, 0.10);
    --up: #4cc19a; --down: #e07a68; --warn: #e2b04a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #181d1a; --fg: #e8ece9; --muted: #98a39c; --line: #2b332e;
  --accent: #d8a23d; --accent-soft: rgba(216, 162, 61, 0.22); --accent-softer: rgba(216, 162, 61, 0.10);
  --up: #4cc19a; --down: #e07a68; --warn: #e2b04a; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .dot { animation: none !important; } }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 940px; margin: 0 auto; padding-block: 0 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; padding-block: 14px; border-bottom: 1px solid var(--line); }
.brand { font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }

.langs button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-softer); font-weight: 600; }
h1 { font-size: 15px; font-weight: 500; color: var(--muted); margin: 0; }
h2 { font-size: 20px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; text-wrap: balance; }
h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; }
.lead { color: var(--muted); font-size: 14px; margin: 0 0 14px; max-width: 70ch; }
section { scroll-margin-top: 12px; }

.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 680px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.big { font-family: var(--font-num); font-size: clamp(30px, 8vw, 46px); font-weight: 500; letter-spacing: -0.03em; line-height: 1.1; margin: 4px 0 6px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.klabel { font-size: 13px; color: var(--muted); }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 13px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.live { background: var(--up); animation: pulse 1.6s ease-in-out infinite; }
.dot.late { background: var(--warn); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.stat { display: flex; flex-direction: column; gap: 14px; }
.stat div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.stat div:last-child { border-bottom: 0; padding-bottom: 0; }
.stat b { font-family: var(--font-num); font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; overflow-wrap: anywhere; }
.chg { font-family: var(--font-num); font-size: 12px; margin-left: 6px; }
.chg.up { color: var(--up); } .chg.down { color: var(--down); }
.note { font-size: 13px; color: var(--muted); margin: 12px 0 0; max-width: 75ch; }
.banner { border: 1px solid var(--warn); color: var(--fg); background: var(--accent-softer); border-radius: 6px; padding: 10px 14px; font-size: 14px; }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 13px; color: var(--muted); }
select, input[type="number"], input[type="text"] { font: inherit; font-family: var(--font-num); font-size: 15px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px; width: 100%; min-width: 0; }

button { font: inherit; font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { font-family: var(--font-num); font-size: 12px; padding: 6px 10px; }
.out { font-family: var(--font-num); font-size: 26px; font-weight: 500; letter-spacing: -0.02em; margin: 16px 0 2px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile .dd { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.tile .dr { font-family: var(--font-num); font-size: 15px; margin-top: 6px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.tile { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; min-width: 0; }
.tile .v { font-family: var(--font-num); font-size: 20px; font-weight: 500; letter-spacing: -0.02em; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.tile .k { font-size: 13px; color: var(--muted); }
.sentence { font-size: 17px; line-height: 1.55; margin: 0 0 16px; max-width: 62ch; }
.sentence b { font-family: var(--font-num); font-weight: 500; white-space: nowrap; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); }
.pill.up { color: var(--up); border-color: var(--up); } .pill.down { color: var(--down); border-color: var(--down); }
.chartbox, .tablewrap { width: 100%; overflow-x: auto; }
svg { display: block; width: 100%; height: auto; min-width: 520px; }
svg text { font-family: var(--font-num); font-size: 11px; fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 18px; height: 8px; margin-inline-end: 6px; vertical-align: middle; border-radius: 1px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th { font-size: 13px; font-weight: 600; color: var(--muted); }
td.num, th.num { text-align: right; font-family: var(--font-num); padding-right: 0; padding-left: 10px; }
.tips { margin: 0 0 16px; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 8px; max-width: 70ch; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.row .field { flex: 1 1 150px; }
.result { margin: 14px 0 0; font-size: 16px; max-width: 70ch; }
.result b { font-family: var(--font-num); font-weight: 500; white-space: nowrap; }
.alist { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

details:last-child { border-bottom: 0; }

details p { margin: 8px 0 0; color: var(--muted); max-width: 70ch; }
.fine { font-size: 13px; color: var(--muted); max-width: 80ch; margin: 0; }
.src { font-size: 12px; color: var(--muted); margin-top: 8px; }
.flag { color: var(--warn); font-size: 12px; }
.exnote { font-size: 13px; color: var(--warn); margin: 0 0 10px; }
.joinlink { color: var(--accent); font-weight: 500; }
.botbtn { position: fixed; z-index: 20; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding: 10px 18px; border-radius: 999px; border: 1px solid var(--accent); background: var(--surface); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15); font-weight: 500; }
.bot { position: fixed; z-index: 21; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); width: min(400px, calc(100vw - 32px)); max-height: min(600px, calc(100vh - 100px)); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 34px rgba(0, 0, 0, 0.22); overflow: hidden; }
.bothead { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.msgs { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1 1 auto; min-height: 140px; }
.m { max-width: 92%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.m.me { align-self: flex-end; background: var(--accent-soft); }
.m.bot { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); }
.botform { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.botform input { flex: 1 1 auto; font-family: var(--font-body); }
.botchips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px; }
.botchips button { font-size: 12px; padding: 5px 9px; }
</style>

<script>
/* ---------- model ---------- */
var KG = 31.1035, LAMBDA = 0.94;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(rnd) { var u = 0, v = 0; while (u === 0) u = rnd(); while (v === 0) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function erf(x) { var s = x < 0 ? -1 : 1; x = Math.abs(x); var t = 1 / (1 + 0.3275911 * x); var y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return s * y; }
function cdf(x) { return 0.5 * (1 + erf(x / Math.SQRT2)); }
function sampleSeries(n) {
  var rnd = mulberry32(7), g = [1], f = [1], i;
  for (i = 1; i < n; i++) { g.push(g[i - 1] * Math.exp(0.0003 + 0.0115 * gauss(rnd))); f.push(f[i - 1] * Math.exp(0.0002 + 0.0030 * gauss(rnd))); }
  var gl = g[n - 1], fl = f[n - 1]; for (i = 0; i < n; i++) { g[i] /= gl; f[i] /= fl; }
  var dates = [], d = new Date(Date.UTC(2026, 10, 11));
  while (dates.length < n) { var wd = d.getUTCDay(); if (wd !== 0 && wd !== 6) dates.push(d.toISOString().slice(0, 10)); d = new Date(d.getTime() - 86400000); }
  dates.reverse();
  return { dates: dates, gold: g, fx: f };
}

["போலி அல்லது தூய்மை குறைந்த தங்கத்தை எப்படித் தவிர்ப்பது?", "மீண்டும் தேடிப் போகக்கூடிய நகைக்கடையில் வாங்குங்கள். கேரட்டும் எடையும் குறிப்பிட்ட பில் கேளுங்கள். தூய்மை எப்படிச் சோதிக்கப்பட்டது என்று கேளுங்கள். விலை மற்றவர்களை விட மிகக் குறைவாக இருந்தால் ஏன் என்று கேளுங்கள்."],

<script>
/* ---------- page ---------- */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var lang = 'en';
  try { var sv = localStorage.getItem('gollk-lang'); if (sv && I[sv]) lang = sv; else { var nl = (navigator.language || '').slice(0, 2); if (I[nl]) lang = nl; } } catch (e) {}
  var t = function (k, v) { var s = (I[lang][k] !== undefined ? I[lang][k] : I.en[k]) || ''; if (v) Object.keys(v).forEach(function (n) { s = s.split('{' + n + '}').join(v[n]); }); return s; };
  var nf = function (v, d) { return v.toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: d }); };
  var rs = function (v) { return 'Rs ' + nf(v, 0); };

  var SAMPLE = sampleSeries(420);
  var live = { example: true, hist: { dates: SAMPLE.dates, gold: SAMPLE.gold.map(function (g) { return g * 4200; }), fx: SAMPLE.fx.map(function (f) { return f * 336; }) }, spot: 4200, fx: 336, updated: new Date(), prevSpot: null, dealer: null, srcGold: '', srcFx: '' };
  var alerts = []; try { alerts = JSON.parse(localStorage.getItem('gollk-alerts') || '[]'); if (!Array.isArray(alerts)) alerts = []; } catch (e) { alerts = []; }
  var saveAlerts = function () { try { localStorage.setItem('gollk-alerts', JSON.stringify(alerts)); } catch (e) {} };
  var lastFair = 0;

  function series() {
    var h = live.hist, g = h.gold.slice(), f = h.fx.slice(), d = h.dates.slice(), today = new Date().toISOString().slice(0, 10);
    if (!live.example && !live.histExample) { if (d[d.length - 1] === today) { g[g.length - 1] = live.spot; f[f.length - 1] = live.fx; } else { g.push(live.spot); f.push(live.fx); d.push(today); } }
    return { gold: g, fx: f, dates: d, S: g.map(function (x, i) { return toSov(x, f[i], 22); }) };
  }

  function applyText() {
    document.documentElement.lang = lang;
    Array.prototype.forEach.call(document.querySelectorAll('[data-i]'), function (el) { el.textContent = t(el.getAttribute('data-i')); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-ip]'), function (el) { el.setAttribute('placeholder', t(el.getAttribute('data-ip'))); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false'); });
    $('tips').innerHTML = (I[lang].tips || I.en.tips).map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('faq').innerHTML = (I[lang].learn || I.en.learn).map(function (qa) { return '<details><summary>' + qa[0] + '</summary><p>' + qa[1] + '</p></details>'; }).join('');
    $('chart').setAttribute('aria-label', t('fc_title'));
  }

  function renderPrice() {
    var fair22g = toSov(live.spot, live.fx, 22) / 8, sov = fair22g * 8; lastFair = sov;
    $('p-sov').textContent = rs(sov);
    $('p-g24').textContent = rs(toSov(live.spot, live.fx, 24) / 8);
    $('p-g22').textContent = rs(fair22g);
    $('p-world').textContent = '$' + nf(live.spot, 2);
    var c = $('p-chg'); if (live.prevSpot && live.prevSpot !== live.spot) { var up = live.spot > live.prevSpot; c.textContent = (up ? '▲ ' : '▼ ') + nf(Math.abs(live.spot - live.prevSpot), 2); c.className = 'chg ' + (up ? 'up' : 'down'); } else { c.textContent = ''; }
    $('p-fx').textContent = nf(live.fx, 2);
    var dl = live.shopMedian || live.dealer; $('p-dealer-row').hidden = !dl;
    if (dl) { $('p-dealer').textContent = rs(dl); $('p-dealer-lab').textContent = live.shopMedian ? t('p_dealer_med', { n: live.shopN }) : t('p_dealer'); }
    $('p-src').textContent = live.example ? t('src_ex') : t('src_live', { g: live.srcGold || 'gold feed', f: live.srcFx || 'FX feed' });
    tick();
  }
  function tick() {
    var dot = $('dot'), st = $('p-status'), age = $('p-age');
    if (live.example) { dot.className = 'dot'; st.textContent = t('st_ex'); age.textContent = t('age_ex'); return; }
    var s = Math.max(0, Math.round((Date.now() - live.updated.getTime()) / 1000));
    var txt = s < 60 ? s + 's' : s < 3600 ? Math.floor(s / 60) + 'm ' + (s % 60) + 's' : Math.floor(s / 3600) + 'h ' + Math.floor(s % 3600 / 60) + 'm';
    var fresh = s < 15 * 60; dot.className = 'dot ' + (fresh ? 'live' : 'late'); st.textContent = fresh ? t('st_live') : t('st_late'); age.textContent = t('age', { s: txt });
  }

  function renderLookup() {
    var karat = parseInt($('karat').value, 10), cur = $('cur').value, rate = cur === 'LKR' ? live.fx : 1;
    var money = function (v) { return cur === 'LKR' ? rs(v) : '$' + nf(v, v < 100 ? 2 : 0); };
    var other = function (v) { return cur === 'LKR' ? '$' + nf(v / live.fx, v / live.fx < 100 ? 2 : 0) : rs(v * live.fx); };
    $('lk-ph').textContent = t('lk_col', { k: karat, c: cur });
    var units = [['u_g', 1], ['u_sov', 8], ['u_oz', 31.1035], ['u_lb', 453.59237], ['u_kg', 1000], ['u_tola', 11.6638]];
    $('lk-rows').innerHTML = units.map(function (u) { return '<tr><td>' + t(u[0]) + '</td><td class="num">' + nf(u[1], u[1] % 1 ? 2 : 0) + '</td><td class="num">' + money(goldValueUsd(u[1], karat, live.spot) * rate) + '</td></tr>'; }).join('');
    var w = parseWeight($('q').value), out = $('lk-out'), sub = $('lk-sub');
    if (!w) { out.textContent = '-'; sub.textContent = t('lk_hint'); return; }
    var val = goldValueUsd(w.grams, karat, live.spot) * rate;
    out.textContent = money(val);
    sub.textContent = t('lk_res', { n: w.n, u: w.unit, g: nf(w.grams, w.grams < 100 ? 2 : 1), k: karat, o: other(val) });
  }

  function chart(S, fc, h, dates) {
    var W = 720, H = 320, L = 66, R = 14, T = 12, B = 30, hist = Math.min(90, S.length), hs = S.slice(S.length - hist), bands = [], k, lo = Infinity, hi = -Infinity, i;
    for (k = 1; k <= h; k++) bands.push(bandAt(fc, k));
    hs.forEach(function (v) { lo = Math.min(lo, v); hi = Math.max(hi, v); });
    bands.forEach(function (b) { lo = Math.min(lo, b.q05); hi = Math.max(hi, b.q95); });
    var pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
    var total = hist - 1 + h, x = function (j) { return L + (W - L - R) * j / total; }, y = function (v) { return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); }, s = '';
    for (i = 0; i <= 4; i++) { var tv = lo + (hi - lo) * i / 4, ty = y(tv); s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + ty + '" y2="' + ty + '" stroke="var(--line)" stroke-width="1"/><text x="' + (L - 8) + '" y="' + (ty + 4) + '" text-anchor="end">' + nf(tv / 1000, 0) + 'k</text>'; }
    var x0 = x(hist - 1);
    function poly(a, b) { var up = [x0 + ',' + y(fc.last)], dn = [x0 + ',' + y(fc.last)]; bands.forEach(function (bd, j) { up.push(x(hist + j) + ',' + y(bd[b])); dn.push(x(hist + j) + ',' + y(bd[a])); }); return up.concat(dn.reverse()).join(' '); }
    s += '<polygon points="' + poly('q05', 'q95') + '" fill="var(--accent-softer)" stroke="var(--accent-soft)" stroke-width="1"/><polygon points="' + poly('q25', 'q75') + '" fill="var(--accent-soft)" stroke="none"/>';
    s += '<line x1="' + x0 + '" x2="' + x0 + '" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--line)" stroke-dasharray="3 3"/>';
    s += '<polyline fill="none" stroke="var(--fg)" stroke-width="1.6" points="' + hs.map(function (v, j) { return x(j) + ',' + y(v); }).join(' ') + '"/>';
    s += '<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 3" points="' + [x0 + ',' + y(fc.last)].concat(bands.map(function (b, j) { return x(hist + j) + ',' + y(b.m); })).join(' ') + '"/>';
    s += '<circle cx="' + x0 + '" cy="' + y(fc.last) + '" r="3.5" fill="var(--fg)"/>';
    s += '<text x="' + L + '" y="' + (H - 8) + '" text-anchor="start">' + dates[dates.length - hist] + '</text><text x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end">+' + h + 'd</text>';
    $('chart').innerHTML = s;
  }

  function renderForecast() {
    var h = parseInt($('horizon').value, 10), sr = series(), fc = forecast(sr.S, h), hl = t('h' + h);
    $('fc-sentence').innerHTML = t('fc_sentence', { h: hl, lo: '<b>' + rs(fc.q05) + '</b>', hi: '<b>' + rs(fc.q95) + '</b>', mid: '<b>' + rs(fc.median) + '</b>' });
    $('t-last').textContent = rs(fc.last); $('t-med').textContent = rs(fc.median); $('t-rng').textContent = rs(fc.q05) + ' - ' + rs(fc.q95);
    $('t-up').textContent = nf(fc.pUp * 100, 0) + '%';
    var pill = $('t-pill'); pill.className = 'pill ' + (fc.pUp > 0.55 ? 'up' : fc.pUp < 0.45 ? 'down' : ''); pill.textContent = fc.pUp > 0.55 ? t('lean_up') : fc.pUp < 0.45 ? t('lean_down') : t('lean_flat');
    chart(sr.S, fc, h, sr.dates);
    var bt = backtest(sr.S, 5), body = $('bt-body');
    if (!bt) { body.innerHTML = ''; $('bt-verdict').textContent = ''; return; }
    body.innerHTML = [['bt_naive', bt.naive], ['bt_model', bt.model], ['bt_trend', bt.trend]].map(function (r) { return '<tr><td>' + t(r[0]) + '</td><td class="num">' + nf(r[1] * 100, 2) + '%</td></tr>'; }).join('');
    $('bt-verdict').textContent = t('bt_v', { n: bt.n, cmp: bt.model < bt.naive * 0.98 ? t('bt_better') : t('bt_same'), c: nf(bt.coverage * 100, 0) }) + (live.example || live.histExample ? t('bt_ex') : '');
  }

  function renderShop() {
    var v = parseFloat($('shop').value), out = $('shop-out');
    if (!(v > 0)) { out.textContent = ''; return; }
    var d = v - lastFair, p = Math.abs(d) / lastFair * 100;
    out.innerHTML = t(d >= 0 ? 'shop_hi' : 'shop_lo', { v: '<b>' + rs(lastFair) + '</b>', d: '<b>' + rs(Math.abs(d)) + '</b>', p: nf(p, 1) });
  }

  function renderAlerts() {
    var ul = $('al-list');
    ul.innerHTML = alerts.length ? alerts.map(function (a, i) { return '<li><span>' + t('al_item', { d: t(a.dir === 'below' ? 'al_below' : 'al_above'), v: rs(a.val) }) + '</span><button type="button" data-rm="' + i + '">' + t('al_rm') + '</button></li>'; }).join('') : '<li>' + t('al_none') + '</li>';
    var hit = alerts.filter(function (a) { return a.dir === 'below' ? lastFair <= a.val : lastFair >= a.val; }), b = $('alert-banner');
    if (hit.length && lastFair > 0) { b.hidden = false; b.textContent = hit.map(function (a) { return t('al_hit', { p: rs(lastFair), d: t(a.dir === 'below' ? 'al_below' : 'al_above'), v: rs(a.val) }); }).join('  '); } else b.hidden = true;
  }

  function renderDays() {
    var sr = series(), fc = forecast(sr.S, 1), grid = $('days-grid'); grid.textContent = '';
    var loc = lang === 'si' ? 'si-LK' : lang === 'ta' ? 'ta-LK' : 'en-GB';
    var dateOf = function (n) { var d = new Date(Date.now() + n * 86400000); try { return d.toLocaleDateString(loc, { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'Asia/Colombo' }); } catch (e) { return d.toDateString(); } };
    [['d_today', 0], ['d_tom', 1], ['d_dat', 2]].forEach(function (x) {
      var tile = document.createElement('div'), mk = function (cls, text) { var e = document.createElement('div'); e.className = cls; e.textContent = text; tile.appendChild(e); };
      tile.className = 'tile'; mk('k', t(x[0])); mk('dd', dateOf(x[1]));
      if (x[1] === 0) { mk('k', t('d_now')); mk('v', rs(fc.last)); }
      else { var b = bandAt(fc, x[1]); mk('k', t('d_range')); mk('v', rs(b.q05) + ' - ' + rs(b.q95)); mk('dr', t('d_mid') + ': ' + rs(b.m)); tile.lastChild.previousSibling.style.fontSize = '17px'; }
      grid.appendChild(tile);
    });
  }

  function renderAll() { renderPrice(); renderDays(); renderLookup(); renderForecast(); renderShops(); renderShop(); renderAlerts(); renderBot(); }

  ['q', 'karat', 'cur'].forEach(function (id) { $(id).addEventListener('input', renderLookup); });
  $('horizon').addEventListener('input', renderForecast); $('shop').addEventListener('input', renderShop);
  $('chips').addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('button[data-q]') : null; if (b) { $('q').value = b.getAttribute('data-q'); renderLookup(); } });
  document.querySelector('.langs').addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('button[data-lang]') : null; if (!b) return; lang = b.getAttribute('data-lang'); try { localStorage.setItem('gollk-lang', lang); } catch (x) {} applyText(); renderAll(); });
  $('al-add').addEventListener('click', function () { var v = parseFloat($('al-val').value); if (!(v > 0) || alerts.length >= 10) return; alerts.push({ dir: $('al-dir').value, val: v }); saveAlerts(); $('al-val').value = ''; renderAlerts(); });
  $('al-list').addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('button[data-rm]') : null; if (!b) return; alerts.splice(parseInt(b.getAttribute('data-rm'), 10), 1); saveAlerts(); renderAlerts(); });

  /* Data: data/latest.json (every few minutes) and data/prices.csv (daily history). Without them the page shows example data. */
  function loadLatest() {
    fetch('data/latest.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : Promise.reject(); }).then(function (j) {
      var spot = parseFloat(j.gold_usd_oz), fx = parseFloat(j.usdlkr), up = new Date(j.updated);
      if (!(spot > 0 && fx > 0) || isNaN(up.getTime())) return;
      if (!live.example && live.spot !== spot) live.prevSpot = live.spot;
      live.spot = spot; live.fx = fx; live.updated = up; live.dealer = parseFloat(j.dealer_22k_sovereign_lkr) > 0 ? parseFloat(j.dealer_22k_sovereign_lkr) : null; live.srcGold = j.source_gold || ''; live.srcFx = j.source_fx || '';
      if (live.example) {
        live.example = false; live.histExample = true;
        live.hist = { dates: SAMPLE.dates, gold: SAMPLE.gold.map(function (g) { return g * spot; }), fx: SAMPLE.fx.map(function (f) { return f * fx; }) };
        fetch('data/prices.csv', { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : Promise.reject(); }).then(function (tx) { live.hist = parseCsv(tx); live.histExample = false; renderAll(); }).catch(function () {});
      }
      renderAll();
    }).catch(function () {});
  }

  /* ---------- shop price board ---------- */
  var CFG = window.GOLD_CONFIG || {};
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function agoShort(d) { var m = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000)); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h'; }
  function median(a) { var s = a.slice().sort(function (x, y) { return x - y; }), n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : 0; }
  function shopRows() {
    if (live.example) {
      var f = lastFair || 340000, r = function (x) { return Math.round(x / 500) * 500; };
      return [{ name: 'Example Jewellers A', city: 'Colombo', sell: r(f * 1.04), buy: r(f * 0.96), at: new Date(Date.now() - 25 * 60000) },
              { name: 'Example Jewellers B', city: 'Kandy', sell: r(f * 1.07), buy: r(f * 0.95), at: new Date(Date.now() - 3 * 3600000) },
              { name: 'Example Jewellers C', city: 'Galle', sell: r(f * 1.12), buy: null, at: new Date(Date.now() - 6 * 3600000) }];
    }
    return live.shops || [];
  }
  function renderShops() {
    var rows = shopRows().slice().sort(function (a, b) { return a.sell - b.sell; }), fair = lastFair || 1;
    $('sh-ex').hidden = !live.example; $('sh-empty').hidden = rows.length > 0; $('sh-wrap').hidden = !rows.length;
    $('sh-body').innerHTML = rows.map(function (r) {
      var d = (r.sell / fair - 1) * 100, off = Math.abs(d) > 25;
      return '<tr><td>' + esc(r.name) + (r.phone ? '<br><span class="src">' + esc(r.phone) + '</span>' : '') + '</td><td>' + esc(r.city) + '</td><td class="num">' + rs(r.sell) + '</td><td class="num">' + (d >= 0 ? '+' : '') + nf(d, 1) + '%' + (off ? '<br><span class="flag">' + t('sh_flag') + '</span>' : '') + '</td><td class="num">' + (r.buy ? rs(r.buy) : '-') + '</td><td class="num">' + agoShort(r.at) + '</td></tr>';
    }).join('');
  }
  function loadShops() {
    if (!CFG.FIREBASE_PROJECT_ID) return;
    /* Firestore REST: ask only for shops with approved == true. The security rules allow no other public read. */
    var fv = function (f, k) { var v = f && f[k]; if (!v) return null; return v.stringValue !== undefined ? v.stringValue : v.integerValue !== undefined ? Number(v.integerValue) : v.doubleValue !== undefined ? Number(v.doubleValue) : v.timestampValue !== undefined ? v.timestampValue : null; };
    fetch('https://firestore.googleapis.com/v1/projects/' + encodeURIComponent(CFG.FIREBASE_PROJECT_ID) + '/databases/(default)/documents:runQuery', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ structuredQuery: { from: [{ collectionId: 'shops' }], where: { fieldFilter: { field: { fieldPath: 'approved' }, op: 'EQUAL', value: { booleanValue: true } } }, limit: 300 } })
    })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (rows) {
        var out = [];
        (Array.isArray(rows) ? rows : []).forEach(function (x) {
          var f = x && x.document && x.document.fields; if (!f) return;
          var s = fv(f, 'sell_22k_sovereign'), b = fv(f, 'buy_22k_sovereign'), at = new Date(fv(f, 'updated_at'));
          if (s > 0 && !isNaN(at.getTime()) && Date.now() - at.getTime() < 24 * 3600000) out.push({ name: String(fv(f, 'name') || '').slice(0, 80), city: String(fv(f, 'city') || '').slice(0, 60), phone: String(fv(f, 'phone') || '').slice(0, 30), sell: s, buy: b > 0 ? b : null, at: at });
        });
        live.shops = out; live.shopN = out.length; live.shopMedian = out.length >= 3 ? median(out.map(function (r) { return r.sell; })) : null; renderAll();
      }).catch(function () {});
  }

  /* ---------- answer bot: no AI and no guessing. It only reads this page's own prices and texts. ---------- */
  var KW = [
    ['fc', ['predict', 'forecast', 'future', 'tomorrow', 'next week', 'next month', 'go up', 'go down', 'going up', 'going down', 'rise or fall', 'will it rise', 'will it fall', 'best time', 'when to buy', 'should i buy', 'good time', 'buy now', 'අනාවැකි', 'ඉහළ යයිද', 'පහළ යයිද', 'හොඳ වේලාව', 'මිලදී ගන්නේ කවදා', 'கணிப்பு', 'ஏறுமா', 'இறங்குமா', 'நல்ல நேரம்', 'எப்போது வாங்க']],
    ['karat', ['karat', 'carat', 'purity', 'කැරට්', 'පිරිසිදු', 'கேரட்', 'தூய்மை']],
    ['sov', ['what is a sovereign', 'what is sovereign', 'sovereign mean', 'pavun', 'පවුමක් යනු', 'පවුම යනු', 'பவுன் என்றால்']],
    ['why', ['why', 'changes', 'change every', 'fluctuat', 'ඇයි', 'වෙනස් වන්නේ', 'ஏன்', 'மாறுகிறது']],
    ['making', ['making charge', 'making cost', 'wastage', 'labour', 'labor', 'වැඩ කුලිය', 'செய்கூலி']],
    ['fake', ['fake', 'fraud', 'genuine', 'hallmark', 'authentic', 'real gold', 'ව්‍යාජ', 'போலி']],
    ['sell', ['sell back', 'selling', 'if i sell', 'buy back', 'buyback', 'resale', 'විකුණ', 'විකිණ', 'விற்ற', 'விற்க']],
    ['shops', ['shop', 'jeweller', 'jeweler', 'dealer', 'cheapest', 'where to buy', 'වෙළඳසැල', 'ජුවලරි', 'කඩ', 'கடை', 'நகைக்கடை']],
    ['alert', ['alert', 'notify', 'notification', 'ඇඟවී', 'எச்சரிக்கை']],
    ['price', ['price', 'rate', 'cost', 'how much', 'today', 'sovereign', 'gram', 'මිල', 'පවුම', 'விலை', 'பவுன்']]
  ];
  var LEARN_IDX = { karat: 0, sov: 1, why: 2, making: 3, fake: 4, sell: 6 };
  function ageStr() {
    if (live.example) return t('age_ex');
    var s = Math.max(0, Math.round((Date.now() - live.updated.getTime()) / 1000));
    return t('age', { s: s < 60 ? s + 's' : s < 3600 ? Math.floor(s / 60) + 'm' : Math.floor(s / 3600) + 'h' });
  }
  function botAnswer(raw) {
    var text = String(raw || '').toLowerCase().trim().slice(0, 200), ex = live.example ? t('bot_exn') : '';
    if (!text) return '';
    var tt = text.replace(/,/g, ''), kar = 22, km = tt.match(/(18|21|22|24)\s*k/); if (km) kar = parseInt(km[1], 10);
    var re = /(\d*\.?\d+)\s*([^\d\s.,?!]+)/g, m, w = null;
    while ((m = re.exec(tt))) { var cand = parseWeight(m[1] + ' ' + m[2]); if (cand) { w = cand; break; } }
    if (w) { var v = goldValueUsd(w.grams, kar, live.spot) * live.fx; return t('bot_weight', { n: w.n, u: w.unit, k: kar, g: nf(w.grams, w.grams < 100 ? 2 : 1), v: rs(v) }) + ex; }
    var best = null, bestN = 0;
    KW.forEach(function (e) { var n = 0; e[1].forEach(function (k) { if (tt.indexOf(k) > -1) n++; }); if (n > bestN) { best = e[0]; bestN = n; } });
    if (!best && (tt === 'hi' || tt.indexOf('hello') === 0 || tt.indexOf('hey') === 0 || tt.indexOf('ආයුබෝවන්') > -1 || tt.indexOf('வணக்கம்') > -1)) return t('bot_hi');
    if (!best) return t('bot_fallback');
    if (LEARN_IDX[best] !== undefined) { var qa = (I[lang].learn || I.en.learn)[LEARN_IDX[best]]; return qa[0] + '\n' + qa[1]; }
    if (best === 'fc') { var sr = series(), fc = forecast(sr.S, 21); return t('bot_fc', { h: t('h21'), lo: rs(fc.q05), hi: rs(fc.q95), mid: rs(fc.median) }) + ex; }
    if (best === 'shops') {
      var rows = shopRows().slice().sort(function (a, b) { return a.sell - b.sell; }).slice(0, 3);
      return (rows.length ? t('bot_shops', { list: rows.map(function (r) { return r.name + ' (' + r.city + ') ' + rs(r.sell); }).join('; ') }) : t('bot_noshops')) + (rows.length ? ex : '');
    }
    if (best === 'alert') return t('bot_alert');
    return t('bot_price', { sov: rs(lastFair), g24: rs(toSov(live.spot, live.fx, 24) / 8), w: '$' + nf(live.spot, 2), fx: nf(live.fx, 2), age: ageStr() }) + ex;
  }
  function addMsg(who, text) { var d = document.createElement('div'); d.className = 'm ' + who; d.textContent = text; $('msgs').appendChild(d); $('msgs').scrollTop = $('msgs').scrollHeight; }
  function ask(q) { q = String(q || '').trim(); if (!q) return; addMsg('me', q); addMsg('bot', botAnswer(q)); }
  function renderBot() {
    $('bot-chips').innerHTML = (I[lang].bot_chips || I.en.bot_chips).map(function (c) { return '<button type="button" data-ask="' + esc(c) + '">' + esc(c) + '</button>'; }).join('');
  }
  $('bot-open').addEventListener('click', function () {
    var box = $('bot'), open = box.hidden; box.hidden = !open; $('bot-open').setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) { if (!$('msgs').children.length) addMsg('bot', t('bot_hi')); $('bot-in').focus(); }
  });
  $('bot-close').addEventListener('click', function () { $('bot').hidden = true; $('bot-open').setAttribute('aria-expanded', 'false'); $('bot-open').focus(); });
  $('bot-form').addEventListener('submit', function (e) { e.preventDefault(); var v = $('bot-in').value; $('bot-in').value = ''; ask(v); });
  $('bot-chips').addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('button[data-ask]') : null; if (b) ask(b.getAttribute('data-ask')); });

  applyText(); renderAll(); loadLatest(); loadShops();
  setInterval(tick, 1000);
  setInterval(loadLatest, 60000);
  setInterval(loadShops, 120000);
})();
</script>
