<html lang="en">
<head>
<meta charset="utf-8">

<title>Jeweller Portal - Gold Outlook LK</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Sinhala:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&display=swap">
<style>
:root { --bg:#f2f4f2; --surface:#fff; --fg:#19201c; --muted:#5c6862; --line:#d7ddd8; --accent:#9a6a12; --accent-soft:rgba(154,106,18,.16); --up:#1d7a5a; --down:#b4412f; --warn:#8a5a00; --font-body:"IBM Plex Sans","Noto Sans Sinhala","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",sans-serif; --font-num:"IBM Plex Mono",ui-monospace,Menlo,monospace; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#111513; --surface:#181d1a; --fg:#e8ece9; --muted:#98a39c; --line:#2b332e; --accent:#d8a23d; --accent-soft:rgba(216,162,61,.22); --up:#4cc19a; --down:#e07a68; --warn:#e2b04a; color-scheme: dark; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.6; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 16px 56px; display: flex; flex-direction: column; gap: 18px; }
.bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.bar a { color: var(--muted); }
.langs { display: flex; gap: 6px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 18px; margin: 0 0 6px; }
.lead, .note { color: var(--muted); font-size: 14px; margin: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 13px; color: var(--muted); }
input[type=text], input[type=email], input[type=password], input[type=number] { font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 10px; width: 100%; }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-size: 15px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.main { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.langs button { padding: 6px 10px; min-width: 44px; font-size: 14px; }
.langs button[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.msg { font-size: 14px; border-radius: 6px; padding: 10px 12px; border: 1px solid var(--line); }
.msg.err { border-color: var(--down); color: var(--down); }
.msg.ok { border-color: var(--up); color: var(--up); }
.msg.warn { border-color: var(--warn); color: var(--fg); }
.cmp { font-size: 14px; color: var(--muted); }
.cmp b { font-family: var(--font-num); font-weight: 500; color: var(--fg); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.check input { margin-top: 5px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a href="index.html" id="back"></a>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="si" aria-pressed="false">සිං</button>
      <button type="button" data-lang="ta" aria-pressed="false">தமி</button>
    </div>
  </div>
  <div><h1 id="ttl"></h1><p class="lead" id="lead" style="margin-top:6px"></p></div>
  <div id="status" class="msg" hidden role="status"></div>

  <section id="v-off" class="panel" hidden><p id="off-t" style="margin:0"></p></section>

  <form id="v-auth" class="panel" hidden>
    <div class="field"><label for="email" id="l-email"></label><input id="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="pass" id="l-pass"></label><input id="pass" type="password" autocomplete="current-password" minlength="8"></div>
    <div class="row"><button type="submit" class="main" id="b-in"></button><button type="button" id="b-up"></button></div>
  </form>

  <form id="v-reg" class="panel" hidden>
    <h2 id="reg-t"></h2>
    <div class="field"><label for="r-name" id="l-name"></label><input id="r-name" type="text" maxlength="80" required></div>
    <div class="field"><label for="r-city" id="l-city"></label><input id="r-city" type="text" maxlength="60" required></div>
    <div class="field"><label for="r-phone" id="l-phone"></label><input id="r-phone" type="text" inputmode="tel" maxlength="30" required></div>
    <div class="row"><button type="submit" class="main" id="b-reg"></button></div>
  </form>

  <section id="v-wait" class="panel" hidden><p id="wait-t" style="margin:0"></p><div id="shopline" class="note"></div></section>

  <form id="v-price" class="panel" hidden>
    <h2 id="pr-t"></h2><div id="shopline2" class="note"></div>
    <div class="field"><label for="p-sell" id="l-sell"></label><input id="p-sell" type="number" inputmode="numeric" min="50000" max="2000000" step="500" required></div>
    <div class="field"><label for="p-buy" id="l-buy"></label><input id="p-buy" type="number" inputmode="numeric" min="50000" max="2000000" step="500"></div>
    <div class="field"><label for="p-g24" id="l-g24"></label><input id="p-g24" type="number" inputmode="numeric" min="5000" max="300000" step="50"></div>
    <div class="cmp" id="cmp"></div>
    <label class="check" id="sure-row" hidden><input type="checkbox" id="sure"><span id="sure-t"></span></label>
    <div class="row"><button type="submit" class="main" id="b-post"></button></div>
    <div class="note" id="last"></div>
  </form>

  <div class="row"><button type="button" id="b-out" hidden></button></div>
</div>
